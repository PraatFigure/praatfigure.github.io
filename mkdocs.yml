site_name: PraatFigure
site_description: Publication-ready phonetic figures from audio and Praat TextGrid files
site_url: https://praatfigure.github.io/
repo_url: https://github.com/PraatFigure/praatfigure.github.io
repo_name: PraatFigure/praatfigure.github.io
edit_uri: edit/main/docs/
site_dir: site
docs_dir: docs
theme:
  name: mkdocs
  language: en
  navigation_depth: 3
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Complete interface guide: user-guide.md
  - Interface: interface.md
  - Selecting a region: selection.md
  - Tracks and appearance: tracks.md
  - Acoustic analysis: acoustics.md
  - Export, templates, and projects: export.md
  - Command line: cli.md
  - Building and publishing: development.md
  - Troubleshooting: troubleshooting.md
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
strict: true
