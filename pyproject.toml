[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praatfigure"
version = "0.1.2"
description = "Publication-ready phonetic figures from audio and Praat TextGrids"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "praatio>=6.2",
]

[project.optional-dependencies]
analysis = ["praat-parselmouth>=0.4.5", "soundfile>=0.12"]
gui = ["PySide6>=6.8,<6.9"]
dev = ["pytest>=8", "pytest-cov>=5"]
build = ["pyinstaller>=6.15,<7"]
docs = ["mkdocs>=1.6,<2"]
all = ["praat-parselmouth>=0.4.5", "soundfile>=0.12", "PySide6>=6.8,<6.9"]

[project.scripts]
praatfigure = "praatfigure.app:main"

[project.urls]
Homepage = "https://praatfigure.github.io/"
Documentation = "https://praatfigure.github.io/"
Repository = "https://github.com/PraatFigure/praatfigure.github.io"
Issues = "https://github.com/PraatFigure/praatfigure.github.io/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
praatfigure = ["presets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
